[project]
name = "ml-workflow-train-eval"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "opencv-python==4.12.0.88",
    "loguru==0.7.3",
    "tqdm",
    "thop",
    "ninja",
    "tabulate",
    "psutil",
    "tensorboard",
    "pycocotools==2.0.10",
    "onnx==1.18.0",
    "onnx-simplifier==0.4.10",
    "mlflow==2.17.0",
    "python-dotenv",
    "boto3",
    "httpx",
    "transformers==4.45.2",
    "peft==0.12.0",
    "datasets==3.0.1",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
]

[tool.uv]
# YOLOX 는 lock 에 포함하지 않고 Dockerfile 에서 editable 로 별도 설치한다(vendored, setup.py 기반).

# torch/torchvision 은 CUDA 12.8(cu128) 빌드로 설치한다. 기본 PyPI wheel 은 cu126 빌드라 지원
# 아키텍처가 sm_90(Hopper)까지여서 Blackwell(sm_120) GPU 에서 "no kernel image" 로 실패한다.
# cu128 빌드는 sm_86(RTX 3090)·sm_120(RTX PRO 6000 Blackwell)을 모두 포함해 dev·prod 를 한 이미지로 커버한다.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

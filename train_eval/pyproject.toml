    "torch==2.7.1",
    "torchvision==0.22.1",
    "opencv-python==4.12.0.88",
    "loguru==0.7.3",
    "tqdm",
    "thop",
    "ninja",
    "tabulate",
    "psutil",
    "tensorboard",
    "pycocotools==2.0.10",
    "onnx==1.18.0",
    "onnx-simplifier==0.4.10",
    "mlflow==2.17.0",
    "python-dotenv",
    "boto3",
    "httpx",
    "transformers==4.45.2",
    "peft==0.12.0",
    "datasets==3.0.1",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",

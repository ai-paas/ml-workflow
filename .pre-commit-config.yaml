# vendored/ 하위는 외부(Biohub 포크 등) 원본을 충실히 복사한 서드파티 코드다.
# 원본 바이트를 보존하기 위해 모든 훅(flake8/isort/black/공백 정리 등)에서 제외한다.
# (Makefile flake8 의 --exclude=*/vendored/* 와 동일 취지)
exclude: '(^|/)vendored/'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
    -   id: flake8
        args: ['--max-line-length=120', '--ignore=E203, W503, W605, E712, E266, F401, E402, F821, E711, F403']
-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        args: ['--profile', 'black', '--line-length', '120', '.']
-   repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
    -   id: black
        args: ['--line-length', '120']

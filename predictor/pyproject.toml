requires-python = ">=3.10,<3.11"
dependencies = [
    "transformers==4.45.2",
    "peft==0.12.0",
    "kserve==0.13.1",
    "mlflow==2.17.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "pillow==10.4.0",
    "scipy==1.14.1",
    "boto3",
    "onnxruntime==1.22.1",
    "tensorflow==2.19.0",
    "timm==1.0.19",
    "opencv-python==4.11.0.86",
    "onnx==1.17.0",
    "onnx-simplifier==0.4.10",
    "loguru==0.7.3",
    "tqdm",
    "ninja",
    "tabulate",
    "thop",
